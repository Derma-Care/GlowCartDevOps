spring:
  application:
    name: onboarding-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/onboardingdb}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME}     # No hardcoded email
    password: ${SPRING_MAIL_PASSWORD}     # No hardcoded password
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
        debug: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://3.6.119.57:3000}
  token-expiry-minutes: ${APP_TOKEN_EXPIRY_MINUTES:60}

# Twilio credentials removed
# twilio:
#   account-sid: ${TWILIO_ACCOUNT_SID}
#   auth-token: ${TWILIO_AUTH_TOKEN}
#   whatsapp-from: ${TWILIO_WHATSAPP_FROM}

notification:
  default-from-email: ${NOTIFICATION_FROM_EMAIL:no-reply@glowkart.com}

version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:

services:

  # ===============================
  # MongoDB
  # ===============================
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ===============================
  # Eureka Server
  # ===============================
  eureka-server:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: production
    container_name: glowcartdevops-eureka-server
    ports:
      - "8761:8761"
    restart: always
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===============================
  # Config Server
  # ===============================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: production
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: glowcartdevops-config-server
    ports:
      - "8888:8888"
    restart: always
    networks:
      - app-network
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===============================
  # API Gateway
  # ===============================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      args:
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: api_gateway_service
    ports:
      - "8080:8080"
    restart: always
    networks:
      - app-network
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===============================
  # Backend Microservices
  # ===============================
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
      args:
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/glowkart_admin
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: admin_service
    ports:
      - "8082:8082"
    restart: always
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/glowkart_admin
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
      args:
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/customer_db
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: customer_service
    ports:
      - "8090:8090"
    restart: always
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/customer_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  onboarding-service:
    build:
      context: ./onboarding-service
      dockerfile: Dockerfile
      args:
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/onboardingdb
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: onboarding_service
    ports:
      - "8081:8081"
    restart: always
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/onboardingdb
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  procedure-service:
    build:
      context: ./procedure-service
      dockerfile: Dockerfile
      args:
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/proceduredb
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: procedure_service
    ports:
      - "8083:8083"
    restart: always
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/proceduredb
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  clinicadmin-service:
    build:
      context: ./clinicadmin-service
      dockerfile: Dockerfile
      args:
        SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/clinicadmindb
        EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    container_name: clinicadmin_service
    ports:
      - "8084:8084"
    restart: always
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/clinicadmindb
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ===============================
  # Frontend Web Services
  # ===============================
  clinic-admin-web:
    build:
      context: ./clinic-admin-web
      dockerfile: Dockerfile
    container_name: clinic_admin_web
    ports:
      - "4200:80"
    restart: always
    networks:
      - app-network
    depends_on:
      api-gateway:
        condition: service_healthy

  main-admin-web:
    build:
      context: ./main-admin-web
      dockerfile: Dockerfile
    container_name: main_admin_web
    ports:
      - "4300:80"
    restart: always
    networks:
      - app-network
    depends_on:
      api-gateway:
        condition: service_healthy